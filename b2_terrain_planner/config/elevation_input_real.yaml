elevation_input_adapter:
  ros__parameters:
    cloud_topic: /rslidar_points
    odom_topic: /dog_odom
    # LiDAR와 /dog_odom은 원본 시각으로 정렬하고, 지도 점군·TF는 같은 수신 시각 사용.
    # 노트북과 센서의 절대 시계 차이로 입력을 버리지 않고 최신 대기 점군만 유지한다.
    use_receive_time: true
    body_frame: base_link
    # 사용자 승인(2026-10-30): 이번 실기 지도 시험에서 두 몸통 프레임을 동일하게 가정.
    # 실제 TF가 있으면 우선 사용하고, 없을 때만 이동·회전 없는 변환을 적용한다.
    body_frame_alias: robot_center
    max_odom_gap: 0.3
    max_age: 1.0
    queue_wait: 0.35
    reset_distance: 1.0
    reset_angle: 1.2
    # 사용자 확인(2026-10-08): 실기 장착은 b2.urdf의 joint_lidar와 동일.
    # 기존 TF 우선, 없으면 이 고정 장착값 사용. 점군은 LiDAR 좌표 기준으로 가정.
    # 센서 프레임 이름은 /rslidar_points.header.frame_id에서 읽는다.
    extrinsic_parent: base_link
    extrinsic_child: ''
    extrinsic_child_from_cloud: true
    extrinsic_xyz: [0.34218, 0.0, 0.17851]
    extrinsic_xyzw: [0.0, 0.0, 0.0, 1.0]
