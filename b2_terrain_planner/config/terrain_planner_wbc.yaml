# 노트북 TAMOLS 기본값. 로봇 측 locomotion_bridge.yaml과 같은 토픽/좌표 계약.
terrain_planner_node:
  ros__parameters:
    state_topic: /robot/locomotion_state
    state_frame: odom
    frame: elevation_odom
    map_topic: /elevation_mapping_node/elevation_map_raw
    plan_topic: /terrain_planner/plan
    marker_topic: /terrain_planner/markers
    command: [0.0, 0.0, 0.0]
    command_topic: /robot/locomotion_command
    command_timeout: 0.25
    plan_rate_hz: 10.0
    time_limit: 0.1
    sample_dt: 0.02
    swing_height: 0.10
    state_max_age: 0.25
    map_max_age: 1.0
    require_map: true
    # raw 입력 보행 비교 중 접촉 기억 패치를 끈다(활성화 시 10x10 cm).
    support_patch.enabled: false
    support_patch.half_width: 0.05
    # 발 중심·접촉면 기준 검증 중 전역 z 재정착은 잠시 끈다.
    # CuPy 시작 초기화도 elevation_map_sim.yaml에서 별도로 끈다.
    map_datum_reanchor.enabled: false
    publish_markers: true
